<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Shipping contact form</title><link rel="stylesheet" href="/skills/style.css"></head><body style="padding:14px;background:#fffef9"><form id="contact"><label for="name">Name</label><input id="name" required><button style="margin-top:12px">Save contact</button></form><p role="status" id="contact-status">No contact saved</p><script>document.querySelector('#contact').addEventListener('submit',event=>{event.preventDefault();document.querySelector('#contact-status').textContent='Contact saved: '+document.querySelector('#name').value;});</script></body></html>
