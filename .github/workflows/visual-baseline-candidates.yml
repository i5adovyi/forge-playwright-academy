name: Prepare visual baseline candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    name: Generate candidates for human review (not comparison evidence)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate Linux candidate images
        run: npm run test:visual:update
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baseline-candidates
          path: quality/visual/baselines/linux/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-candidate-report
          path: quality-results/visual-report/
          retention-days: 14
